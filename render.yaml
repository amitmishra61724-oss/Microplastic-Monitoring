services:
  - type: web
    name: microplastic-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LOW_CONCENTRATION_THRESHOLD
        value: 10.0
      - key: HIGH_CONCENTRATION_THRESHOLD
        value: 50.0
